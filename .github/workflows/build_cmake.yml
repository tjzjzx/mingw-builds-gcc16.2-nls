name: x86_64 and i686 release builds

on: [push, pull_request]

env:
  MINGW_BUILDS_GCC_VERSION: "16.2.0"
  MINGW_BUILDS_RT_VERSION: "v14"
  # Bump when the set of cached directories changes: the cache key has to
  # change too, otherwise the old (incomplete) entry keeps being restored.
  PREREQ_CACHE_REV: "2"

jobs:
  download:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        update: true

    - name: Randomly select a GNU mirror server
      shell: msys2 {0}
      run: |
        urls=("https://mirrors.ocf.berkeley.edu/gnu/" "https://mirror.techrich.hk/gnu/" "https://mirror.team-cymru.com/gnu/" "https://mirror.cs.odu.edu/gnu/")
        selected_mirror="${urls[$RANDOM % ${#urls[@]}]}"
        echo "GNU mirror server to use: $selected_mirror"
        echo "GNU_URL_PREFIX=$selected_mirror" >> $GITHUB_ENV

    - name: Download sources
      shell: msys2 {0}
      run: >-
        ./build
        --mode=gcc-$MINGW_BUILDS_GCC_VERSION
        --buildroot=/c/buildroot
        --jobs=4
        --rev=0
        --with-default-msvcrt=ucrt
        --rt-version=$MINGW_BUILDS_RT_VERSION
        --threads=mcf
        --exceptions=seh
        --arch=x86_64
        --bin-compress
        --enable-languages=c,c++,fortran
        --logviewer-command=cat
        --fetch-only
        --gnu-url-prefix=$GNU_URL_PREFIX

    - name: Compress sources
      run: 7z a src.7z src "-xr!.git"
      working-directory: c:/buildroot

    - name: Upload sources
      uses: actions/upload-artifact@v7
      with:
        path: c:/buildroot/src.7z
        compression-level: 0
        archive: false

  # Builds the prerequisites (libiconv, gettext, gmp/mpfr/mpc/isl, mingw-w64
  # headers/crt/winpthreads, binutils) once per arch + msvcrt and caches them.
  # These take ~40 min per job and do not depend on threads/exceptions, so all
  # build jobs restore the same entry instead of rebuilding them 10 times.
  # Exception: threads=mcf makes mingw-w64-crt be built with
  # -D__USING_MCFGTHREAD__ (scripts/mingw-w64-crt.sh:105), so mcf needs its own
  # entry; win32 and posix build identical prerequisites and share one.
  prereqs:
    name: prereqs-${{ matrix.arch }}-${{ matrix.threads }}-${{ matrix.msvcrt }}
    runs-on: windows-latest
    needs: download
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        threads: [posix, mcf]
        msvcrt: [msvcrt, ucrt]
        exclude:
          - threads: mcf
            msvcrt: msvcrt

    steps:
    - uses: actions/checkout@v7

    - name: Restore prerequisites cache
      id: prereq-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          c:/buildroot/prerequisites
          c:/buildroot/prerequisites-build
          c:/buildroot/prerequisites-logs
          c:/buildroot/runtime
        key: prereqs-${{ matrix.arch }}-${{ matrix.threads == 'mcf' && 'mcf' || 'posix' }}-${{ matrix.msvcrt }}-gcc${{ env.MINGW_BUILDS_GCC_VERSION }}-rt${{ env.MINGW_BUILDS_RT_VERSION }}-${{ hashFiles('scripts/**', 'library/**', 'patches/**') }}-r${{ env.PREREQ_CACHE_REV }}

    - uses: msys2/setup-msys2@v2
      if: steps.prereq-cache.outputs.cache-hit != 'true'
      with:
        update: true

    - name: Download sources
      if: steps.prereq-cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v8
      with:
        name: src.7z
        path: c:/buildroot

    - name: Extract sources
      if: steps.prereq-cache.outputs.cache-hit != 'true'
      run: 7z x src.7z
      working-directory: c:/buildroot

    # There is no "prerequisites only" switch in ./build, so let it run and cut
    # it off while GCC is compiling. The step timeout keeps the job well under
    # the 6h GitHub-hosted limit; only the markers written by the prerequisites
    # are cached, the (throwaway) GCC build dir is not. Generous margin over the
    # measured ~40 min: if the run is slower and the cut lands inside a
    # prerequisite, the "Check prerequisites are complete" gate below refuses to
    # cache the half-written state and the next run starts over instead of
    # resuming from a poisoned cache.
    - name: Build prerequisites
      if: steps.prereq-cache.outputs.cache-hit != 'true'
      timeout-minutes: 80
      continue-on-error: true
      shell: msys2 {0}
      run: >-
        ./build
        --mode=gcc-$MINGW_BUILDS_GCC_VERSION
        --buildroot=/c/buildroot
        --jobs=4
        --rev=0
        --with-default-msvcrt=${{ matrix.msvcrt }}
        --rt-version=$MINGW_BUILDS_RT_VERSION
        --threads=${{ matrix.threads }}
        --exceptions=${{ matrix.arch == 'x86_64' && 'seh' || 'dwarf' }}
        --arch=${{ matrix.arch }}
        --bin-compress
        --enable-languages=c,c++,fortran
        --logviewer-command=cat

    # binutils is the last prerequisite; only cache when it really finished,
    # otherwise a half-written object file could end up in the immutable cache.
    - name: Check prerequisites are complete
      id: prereq-ok
      if: steps.prereq-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ok = if (Get-ChildItem "c:/buildroot/prerequisites-build/*binutils*/_installed.marker" -ErrorAction SilentlyContinue) { 'true' } else { 'false' }
        "complete=$ok" >> $env:GITHUB_OUTPUT

    - name: Save prerequisites cache
      if: steps.prereq-cache.outputs.cache-hit != 'true' && steps.prereq-ok.outputs.complete == 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.prereq-cache.outputs.cache-primary-key }}
        path: |
          c:/buildroot/prerequisites
          c:/buildroot/prerequisites-build
          c:/buildroot/prerequisites-logs
          c:/buildroot/runtime

  build:
    name: ${{ matrix.arch }}-${{ matrix.threads }}-${{ matrix.exceptions }}-${{ matrix.msvcrt }}
    runs-on: windows-latest
    needs: [download, prereqs]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        threads: [posix, win32, mcf]
        exceptions: [seh, dwarf]
        msvcrt: [msvcrt, ucrt]
        exclude:
          - arch: x86_64
            exceptions: dwarf
          - arch: i686
            exceptions: seh
          - threads: mcf
            msvcrt: msvcrt

    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        update: true

    - name: Download sources
      uses: actions/download-artifact@v8
      with:
        name: src.7z
        path: c:/buildroot

    - name: Extract sources
      run: 7z x src.7z
      working-directory: c:/buildroot

    - name: Restore prerequisites cache
      uses: actions/cache/restore@v6
      with:
        path: |
          c:/buildroot/prerequisites
          c:/buildroot/prerequisites-build
          c:/buildroot/prerequisites-logs
          c:/buildroot/runtime
        key: prereqs-${{ matrix.arch }}-${{ matrix.threads == 'mcf' && 'mcf' || 'posix' }}-${{ matrix.msvcrt }}-gcc${{ env.MINGW_BUILDS_GCC_VERSION }}-rt${{ env.MINGW_BUILDS_RT_VERSION }}-${{ hashFiles('scripts/**', 'library/**', 'patches/**') }}-r${{ env.PREREQ_CACHE_REV }}
        # Without the prerequisites this job would rebuild them and die at the
        # 6h limit; fail in seconds instead.
        fail-on-cache-miss: true

    - name: Build
      shell: msys2 {0}
      run: >-
        ./build
        --mode=gcc-$MINGW_BUILDS_GCC_VERSION
        --buildroot=/c/buildroot
        --jobs=4
        --rev=0
        --with-default-msvcrt=${{ matrix.msvcrt }}
        --rt-version=$MINGW_BUILDS_RT_VERSION
        --threads=${{ matrix.threads }}
        --exceptions=${{ matrix.exceptions }}
        --arch=${{ matrix.arch }}
        --bin-compress
        --enable-languages=c,c++,fortran
        --logviewer-command=cat

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: bin-${{ matrix.arch }}-${{ matrix.threads }}-${{ matrix.exceptions }}-${{ matrix.msvcrt }}
        path: c:/buildroot/archives/

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        pattern: "bin-*"
        path: ./
        merge-multiple: true

    - name: Upload to Release
      id: upload_to_release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.7z"
